<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q6 Responsive CSS Cheat Sheet</title><link rel="stylesheet" href="Q6-Responsive-CSS-Cheat-Sheet.css"></head><body><main><h1>Responsive CSS Cheat Sheet</h1><section class="sheet"><article><h2>Filters</h2><p><code>filter: grayscale(1);</code></p></article><article><h2>Media Queries</h2><p><code>@media(max-width:700px)</code></p></article><article><h2>Responsive Design</h2><p>Use Flexbox, Grid and relative units.</p></article><article><h2>Typography</h2><p><code>font-size:clamp(1rem,2vw,2rem);</code></p></article><article><h2>Grid</h2><p><code>repeat(auto-fit,minmax(200px,1fr))</code></p></article><article><h2>Flexbox</h2><p><code>display:flex; gap:20px;</code></p></article></section></main></body></html>
