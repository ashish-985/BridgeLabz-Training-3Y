<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q1 - Responsive Image Filter Gallery</title><link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
<header><h1>Responsive Image Filter Gallery</h1></header>
<main class="gallery">
<figure><img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain landscape"><figcaption>Blur Filter</figcaption></figure>
<figure><img class="grayscale" src="https://picsum.photos/id/1025/500/350" alt="Dog portrait"><figcaption>Grayscale Filter</figcaption></figure>
<figure><img class="sepia" src="https://picsum.photos/id/1035/500/350" alt="River landscape"><figcaption>Sepia Filter</figcaption></figure>
<figure><img class="brightness" src="https://picsum.photos/id/1043/500/350" alt="Forest road"><figcaption>Brightness Filter</figcaption></figure>
<figure><img class="contrast" src="https://picsum.photos/id/1050/500/350" alt="Mountain valley"><figcaption>Contrast Filter</figcaption></figure>
<figure><img class="hue" src="https://picsum.photos/id/1069/500/350" alt="Coastal landscape"><figcaption>Hue-Rotate Filter</figcaption></figure>
</main>
</body></html>
